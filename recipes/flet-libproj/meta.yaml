{% set version = "9.9.0" %}

package:
  name: flet-libproj
  version: '{{ version }}'

source:
  # GitHub release asset: byte-identical to download.osgeo.org, which flakes in CI.
  url: https://github.com/OSGeo/PROJ/releases/download/{{ version }}/proj-{{ version }}.tar.gz

build:
  number: 1
# {% if sdk != 'android' %}
  script_env:
    LDFLAGS: '-undefined dynamic_lookup'
# {% endif %}

requirements:
  build:
    - cmake
  host:
    - flet-libtiff 4.7.2
    - flet-libcurl 8.23.0

about:
  license: MIT
