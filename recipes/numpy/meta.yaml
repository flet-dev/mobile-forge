# Building for Android requires API Level 24 or above.
# See https://apilevels.com

package:
  name: numpy
# 2.4.x predates 3.15 support; 2.5.x is upstream's 3.15 line (cp315 wheels
# from 2.5.2, "supported starting with the first 3.15 rc" per 2.5.0 notes).
# {% if py_version.minor >= 15 %}
  version: "2.5.2"
# {% else %}
  version: "2.4.6"
# {% endif %}

requirements:
 build:
  - ninja
{% if sdk == 'android' %}
 host:
  - flet-libcpp-shared >=27.2.12479018
{% endif %}

{% if version and version < (2, 0) %}
patches:
  - mobile-1.26.4.patch
{% endif %}

build:
  number: 1
  script_env:
    NPY_DISABLE_SVML: 1

  backend-args:
    - -Csetup-args=-Dblas=none
    - -Csetup-args=-Dlapack=none
    - -Csetup-args=--cross-file
    - -Csetup-args={MESON_CROSS_FILE}

  meson:
    properties:
# {% if sdk == 'android' and arch in ['arm64-v8a', 'x86_64'] %}
      longdouble_format: IEEE_QUAD_LE
# {% else %}
      longdouble_format: IEEE_DOUBLE_LE
# {% endif %}
