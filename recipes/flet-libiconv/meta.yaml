{% set version = "1.17" %}

package:
  name: flet-libiconv
  version: '{{ version }}'
  # Android bionic only ships iconv from API 28; mobile-forge targets API 24, so
  # Android-only consumers (e.g. flet-libzbar, whose QR decoder #includes
  # <iconv.h> unconditionally) need this. iOS/macOS have a system libiconv, so
  # this recipe is never built there.
  platforms: [android]

build:
  number: 2

source:
  url: https://ftp.gnu.org/gnu/libiconv/libiconv-{{ version }}.tar.gz

about:
  # Pinned deliberately: the top-level COPYING is GPL-3.0 covering the `iconv`
  # program and docs, which build.sh deletes. Only COPYING.LIB applies to the
  # library this wheel ships, and auto-discovery would bundle both.
  license_file: COPYING.LIB
  license: LGPL-2.1-or-later
