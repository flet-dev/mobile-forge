[project]
name = "pyyaml-settings-file"
version = "1.0.0"
description = "Writes a settings file on device and times the C loader against the pure one."
requires-python = ">=3.10"

dependencies = [
    "flet==0.86.5",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
