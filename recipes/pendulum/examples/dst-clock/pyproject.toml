[project]
name = "pendulum-dst-clock"
version = "1.0.0"
description = "Prints what this device knows about time zones, and where a day is not 24 hours."
requires-python = ">=3.10"

dependencies = [
    "flet==0.86.5",
    "pendulum==3.2.0",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
