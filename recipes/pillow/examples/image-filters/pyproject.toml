[project]
name = "pillow-image-filters"
version = "1.0.0"
description = "Draws an image with Pillow and filters it on device."
requires-python = ">=3.10"

dependencies = [
    "flet==0.86.5",
    "pillow==12.2.0",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
