package:
  name: pyproj
  version: "3.7.2"

build:
  number: 1
  script_env:
    PROJ_VERSION: 9.5.0
    PROJ_DIR: '{platlib}/opt'
# {% if sdk != 'android' %}
    # iOS links every flet-lib* as a static archive, so the upper library is
    # missing the objects its own dependencies need; dyld aborts at dlopen on
    # the first unresolved symbol (_TIFFClientOpen). Naming the whole chain here makes
    # each extension's link pull them in. Full explanation, and the upstream fix
    # that would retire it, in forge-error-catalogue: "symbol not found in flat
    # namespace" (iOS, transitive dep of a static flet-lib*).
    PROJ_LIBS: proj,tiff,curl,psl,sqlite3,jpeg,ssl,crypto,z
    LDFLAGS: '-undefined dynamic_lookup'
# {% endif %}

requirements:
  host:
    - flet-libproj 9.5.0
# {% if sdk != 'android' %}
    # iOS-only — see PROJ_LIBS comment above for the rationale.
    - openssl >=3.0.15
    - flet-libjpeg 3.0.90
# {% endif %}

patches:
  - mobile.patch
