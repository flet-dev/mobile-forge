package:
  name: zeroconf
# zeroconf 0.150.0's .pxd/.py signatures are rejected by Cython 3.3 (the first with
# Python 3.15 wheels): "Signature not compatible with previous declaration". 0.154.0 builds.
# {% if py_version.minor >= 15 %}
  version: "0.154.0"
# {% else %}
  version: "0.150.0"
# {% endif %}

build:
  number: 1
  script_env:
    # zeroconf's Cython extensions are optional-by-default (SKIP_CYTHON /
    # swallowed build errors). Force them: a wheel without the 18 accelerator
    # .so files would be a silent pure-Python fallback.
    REQUIRE_CYTHON: "1"

requirements:
  build:
    - cython

patches:
  - require-cython-fail-loud.patch
