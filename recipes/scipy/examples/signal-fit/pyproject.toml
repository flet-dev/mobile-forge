[project]
name = "scipy-signal-fit"
version = "1.0.0"
description = "Filters a noisy waveform with scipy and fits its parameters back out."
requires-python = ">=3.10"

dependencies = [
    "flet",
    "scipy",
    "numpy",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
