[project]
name = "scipy-signal-fit"
version = "1.0.0"
description = "Filters a noisy waveform with scipy and fits its parameters back out."
requires-python = ">=3.10"

dependencies = [
    "flet==0.86.5",
    "scipy==1.18.0",
    "numpy==2.4.6",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
