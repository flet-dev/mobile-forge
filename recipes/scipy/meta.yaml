package:
  name: scipy
  version: "1.18.0"

requirements:
  build:
    - ninja
    - meson
    - cython
    - pythran
  host:
    - numpy 2.4.6
    - pybind11
# {% if sdk == 'android' %}
    # A real runtime dependency: libc++_shared.so must reach the device, so this
    # belongs in Requires-Dist and must stay under `host`.
    - flet-libcpp-shared >=27.2.12479018
# {% endif %}
  host_build:
    # OpenBLAS is built NO_SHARED=1 — libopenblas.a and nothing else — and meson
    # links it into scipy's own extensions. host_build installs it for that link
    # without promoting it to Requires-Dist; under `host` forge would add
    # `flet-libopenblas (==0.3.33)` to the wheel, making every consuming build
    # resolve and download ~70 MB of archive that no import can reach. The
    # published build-1 wheels predate the entry and carry no such dependency, so
    # this keeps a rebuild from introducing one.
    - flet-libopenblas 0.3.33

patches:
  - android-bionic-clog-cpow.patch
  - android-ducc-no-affinity.patch
  - android-x86_64-boost-longdouble.patch

build:
  # 2 keeps flet-libopenblas out of Requires-Dist (host -> host_build). The
  # build-1 wheels on the index predate the entry and already carry no such
  # dependency, so this is what stops a rebuild from adding one.
  number: 2
  backend-args:
    # scipy 1.18 builds without a Fortran compiler — only the deprecated
    # scipy.odr is dropped. Removes the cross-Fortran blocker entirely.
    - -Csetup-args=-D_without-fortran=true
    # BLAS/LAPACK from flet-libopenblas (OpenBLAS, NOFORTRAN f2c-LAPACK) on both
    # platforms, resolved via its openblas.pc. Standard Fortran mangling.
    - -Csetup-args=-Dblas=openblas
    - -Csetup-args=-Dlapack=openblas
# {% if sdk == 'android' %}
    # pythran 0.18.1's pythonic/types/ndarray.hpp has an ill-formed ref-qualifier
    # overload that the newer NDK clang rejects (Apple clang accepts it, so iOS
    # keeps pythran). pythran is an optional scipy build dep — disable it on
    # Android; the affected modules fall back to their cython/numpy versions.
    - -Csetup-args=-Duse-pythran=false
# {% endif %}
    - -Csetup-args=--cross-file
    - -Csetup-args={MESON_CROSS_FILE}
