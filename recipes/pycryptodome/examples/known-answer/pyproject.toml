[project]
name = "pycryptodome-known-answer"
version = "1.0.0"
description = "Published NIST and RFC vectors recomputed on device by pycryptodome."
requires-python = ">=3.12"

dependencies = [
    "flet==0.86.5",
    "pycryptodome==3.23.0",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
