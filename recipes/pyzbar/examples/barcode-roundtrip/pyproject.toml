[project]
name = "pyzbar-barcode-roundtrip"
version = "1.0.0"
description = "Encodes three barcodes, decodes them back with pyzbar and shows whether the round trip held."
requires-python = ">=3.10"

dependencies = [
    "flet==0.86.5",
    "pyzbar==0.1.9",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
