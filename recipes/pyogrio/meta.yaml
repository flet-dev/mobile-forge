package:
  name: pyogrio
  version: "0.12.1"

requirements:
  host:
    - flet-libgdal 3.13.1
# {% if sdk != 'android' %}
    # iOS-only — see GDAL_LIBS comment below for the rationale.
    - openssl >=3.0.15
    - flet-libjpeg 3.0.90
# {% endif %}

build:
  # 2 adds ios-driver-registry.patch: with a static libgdal each extension has
  # its own driver registry, so _io resolved driver names in one nothing had
  # populated and could not open a dataset on iOS.
  number: 2
  script_env:
    GDAL_VERSION: 3.13.1
    # pyogrio reads GDAL_LIBRARY_PATH (one directory). fiona and rasterio read
    # GDAL_LIB_PATH (a colon-separated list) — one word apart, easy to copy wrong.
    GDAL_LIBRARY_PATH: '{platlib}/opt/lib'
    GDAL_INCLUDE_PATH: '{platlib}/opt/include'
# {% if sdk != 'android' %}
    # iOS links every flet-lib* as a static archive, so the upper library is
    # missing the objects its own dependencies need; dyld aborts at dlopen on
    # the first unresolved symbol (_geod_init). Naming the whole chain here makes
    # each extension's link pull them in. Full explanation, and the upstream fix
    # that would retire it, in forge-error-catalogue: "symbol not found in flat
    # namespace" (iOS, transitive dep of a static flet-lib*).
    GDAL_LIBS: gdal,proj,tiff,curl,psl,sqlite3,jpeg,ssl,crypto,z
    LDFLAGS: '-undefined dynamic_lookup'
# {% endif %}

patches:
  - mobile.patch
  - ios-driver-registry.patch
