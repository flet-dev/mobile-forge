[project]
name = "oracledb-thin-client"
version = "1.0.0"
description = "Reports what the python-oracledb thin driver does on a phone, with no server."
requires-python = ">=3.10"

dependencies = [
    "flet==0.86.5",
    "oracledb==4.0.1",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
