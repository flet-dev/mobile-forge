[project]
name = "opencv-shape-finder"
version = "1.0.0"
description = "Segments shapes out of a noisy scene with OpenCV and shows the result."
requires-python = ">=3.11"

dependencies = [
    "flet==0.86.5",
    "opencv-python==5.0.0.93",
    "numpy==2.4.6",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"

[tool.flet.android]
extract_packages = ["cv2"]
