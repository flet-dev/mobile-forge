[project]
name = "safetensors-lazy-weights"
version = "1.0.0"
description = "Measures on device what reading a safetensors file lazily actually costs."
requires-python = ">=3.11"

dependencies = [
    "flet==0.86.5",
    "safetensors==0.8.0",
    "numpy==2.4.6",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
