[project]
name = "fiona-feature-roundtrip"
version = "1.0.0"
description = "Writes vector layers on device and compares the read-back against its source records."
requires-python = ">=3.10"

dependencies = [
    "flet==0.86.5",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.android]
dependencies = ["fiona==1.10.1", "flet-libcpp-shared"]

[tool.flet.ios]
dependencies = ["fiona==1.10.1"]

[tool.flet.app]
path = "src"
