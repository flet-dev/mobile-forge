[project]
name = "pyerfa-sky-clock"
version = "1.0.0"
description = "Runs the device clock through five time scales and places stars with ERFA."
requires-python = ">=3.11"

dependencies = [
    "flet==0.86.5",
    "pyerfa==2.0.1.5",
    "numpy==2.4.6",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
