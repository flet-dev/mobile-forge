[project]
name = "curl-cffi-fingerprint-fanout"
version = "1.0.0"
description = "Probes one endpoint as five browsers at once and compares the fingerprints it reports."
requires-python = ">=3.12"

dependencies = [
    "flet==0.86.5",
    "curl-cffi==0.16.2",
    "certifi",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"

[tool.flet.android]
target_arch = ["arm64-v8a", "x86_64"]
