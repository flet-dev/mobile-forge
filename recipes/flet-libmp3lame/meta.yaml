{% set version = "3.100" %}

# Static PIC libmp3lame -- the MP3 *encoder* half of flet-libsndfile's MP3
# support (mpg123 is the decoder half; libsndfile needs both or neither).
# Link-time only -- nothing ships to the device.
package:
  name: flet-libmp3lame
  version: '{{ version }}'

build:
  number: 1

source:
  # Debian's pool copy, not SourceForge's. `downloads.sourceforge.net` bounces
  # through a randomly chosen mirror and timed out its TLS handshake on two of
  # six CI legs (run 34892127701); this host is stable and serves the same bytes.
  # Upstream remains https://sourceforge.net/projects/lame/files/lame/{{ version }}/.
  url: https://deb.debian.org/debian/pool/main/l/lame/lame_{{ version }}.orig.tar.gz

about:
  # COPYING is the LGPL v2 text; every source header adds "or (at your option)
  # any later version".
  license: LGPL-2.0-or-later
