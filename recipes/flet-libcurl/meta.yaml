{% set version = "8.23.0" %}

package:
  name: flet-libcurl
  version: '{{ version }}'

source:
  url: https://curl.se/download/curl-{{ version }}.tar.gz

build:
  number: 1

requirements:
  host:
    # {% if sdk in ['iphoneos', 'iphonesimulator'] %}
    - openssl >=3.0.15
    # {% endif %}
    - flet-libpsl 0.23.3

patches:
  - config.patch

about:
  license: curl
