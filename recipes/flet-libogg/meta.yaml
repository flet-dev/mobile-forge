{% set version = "1.3.6" %}

# Static PIC archive: the Ogg container layer for flet-libsndfile's FLAC,
# Vorbis and Opus support. Folded into libsndfile.so at link time, so this
# is a host_build (link-time) dependency and nothing ships to the device.
package:
  name: flet-libogg
  version: '{{ version }}'

build:
  number: 1

source:
  url: https://github.com/xiph/ogg/releases/download/v{{ version }}/libogg-{{ version }}.tar.gz

requirements:
  build:
    - cmake

about:
  license: BSD-3-Clause
