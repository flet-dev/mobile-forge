package:
  name: rasterio
  version: "1.5.0"

requirements:
  host:
    - flet-libgdal 3.13.1
    - numpy ^2.0.0
# {% if sdk == 'android' %}
    # rasterio's `_warp.so` / `_filepath.so` / `_fill.so` carry
    # `DT_NEEDED libc++_shared.so` directly.
    - flet-libcpp-shared >=27.2.12479018
# {% else %}
    # iOS-only — see GDAL_LIBS comment below for the rationale.
    - openssl >=3.0.15
    - flet-libjpeg 3.0.90
# {% endif %}

build:
  # Same source version as pypi.flet.dev's rasterio-1.5.0-10 wheel, but
  # this rebuild links against flet-libgdal 3.13.1 (vs. the published
  # wheel's 3.10.0). pip's wheel selection picks the higher build_tag
  # per PEP 427 when name+version collide; the new wheel must outrank
  # build 10 or downstream installs would silently keep the old
  # libgdal-3.10-linked rasterio and the gdal chain bump would be invisible.
  number: 11
  script_env:
    GDAL_VERSION: 3.13.1
    # rasterio reads GDAL_LIB_PATH (a colon-separated list); pyogrio's is spelled
    # GDAL_LIBRARY_PATH and takes one directory. Easy to copy the wrong one.
    GDAL_LIB_PATH: '{platlib}/opt/lib'
    GDAL_INCLUDE_PATH: '{platlib}/opt/include'
# {% if sdk == 'android' %}
    GDAL_LIBS: gdal
# {% else %}
    # iOS links every flet-lib* as a static archive, so the upper library is
    # missing the objects its own dependencies need; dyld aborts at dlopen on
    # the first unresolved symbol (_geod_init). Naming the whole chain here makes
    # each extension's link pull them in. Full explanation, and the upstream fix
    # that would retire it, in forge-error-catalogue: "symbol not found in flat
    # namespace" (iOS, transitive dep of a static flet-lib*).
    GDAL_LIBS: gdal,proj,tiff,curl,psl,sqlite3,jpeg,ssl,crypto,z
    LDFLAGS: '-undefined dynamic_lookup'
# {% endif %}

patches:
  - mobile.patch
