[project]
name = "soxr-resample-tone"
version = "1.0.0"
description = "Resamples a generated tone on a worker thread and reports rate, timing and engine."
requires-python = ">=3.12"

dependencies = [
    "flet==0.86.5",
    "soxr==1.1.0",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
