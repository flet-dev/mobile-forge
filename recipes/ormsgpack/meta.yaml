package:
  name: ormsgpack
# ormsgpack 1.12.2 pins pyo3 0.27, which stops at Python 3.14; 1.13.0 builds for 3.15.
# {% if py_version.minor >= 15 %}
  version: "1.13.0"
# {% else %}
  version: "1.12.2"
# {% endif %}

build:
  number: 1
  script_env:
    _PYTHON_SYSCONFIGDATA_NAME: '{sysconfigdata_name}'
