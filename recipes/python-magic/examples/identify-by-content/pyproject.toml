[project]
name = "python-magic-identify-by-content"
version = "1.0.0"
description = "Writes ten files and asks libmagic what each one really is, ignoring its name."
requires-python = ">=3.10"

dependencies = [
    "flet==0.86.5",
    "python-magic==0.4.27",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
