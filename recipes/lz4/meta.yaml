package:
  name: lz4
  version: "4.4.5"

build:
  number: 1
  script_env:
    # Always compile the liblz4 the sdist vendors. setup.py otherwise links any
    # liblz4 >= 1.7.5 pkg-config can see -- none in the cross env today, but one
    # appearing there would add a runtime library dependency nothing ships.
    PYLZ4_USE_SYSTEM_LZ4: "0"
