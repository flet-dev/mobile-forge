package:
  name: coolprop
  version: "8.0.0"

requirements:
  build:
    - cmake
# {% if sdk == 'android' %}
  host:
    - flet-libcpp-shared >=27.2.12479018
# {% endif %}

patches:
  - mkdir-cython-output.patch

build:
  number: 1
  script_env:
    # 8.0 defaults to a nanobind core plus Cython "capsule shim" sidecars. That
    # path links no libpython on Android (undefined PyMem_Malloc etc.) and writes
    # into a build dir it never creates on iOS. COOLPROP_NANOBIND=OFF keeps the
    # legacy Cython wrapper, the shape 7.x shipped.
# {% if sdk == 'android' %}
    CMAKE_ARGS: >-
      -DCOOLPROP_NANOBIND=OFF
      -DCMAKE_TOOLCHAIN_FILE={NDK_ROOT}/build/cmake/android.toolchain.cmake
      -DANDROID_ABI={ANDROID_ABI}
      -DANDROID_PLATFORM=android-{ANDROID_API_LEVEL}
      -DANDROID_STL=c++_shared
      -DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384
      -DCMAKE_MODULE_LINKER_FLAGS=-Wl,-z,max-page-size=16384
      -DPython_LIBRARY={HOST_PYTHON_HOME}/lib/libpython{py_version_short}.so
      -DPython_INCLUDE_DIR={HOST_PYTHON_HOME}/include/python{py_version_short}
      -DPython3_LIBRARY={HOST_PYTHON_HOME}/lib/libpython{py_version_short}.so
      -DPython3_INCLUDE_DIR={HOST_PYTHON_HOME}/include/python{py_version_short}
# {% else %}
    CMAKE_ARGS: >-
      -DCOOLPROP_NANOBIND=OFF
      -DCMAKE_SYSTEM_NAME=iOS
      -DCMAKE_OSX_SYSROOT={{ sdk }}
      -DCMAKE_OSX_DEPLOYMENT_TARGET={{ sdk_version }}
      -DCMAKE_OSX_ARCHITECTURES={{ arch }}
      -DPython_LIBRARY={HOST_PYTHON_HOME}/lib/libpython{py_version_short}.dylib
      -DPython_INCLUDE_DIR={HOST_PYTHON_HOME}/include/python{py_version_short}
      -DPython3_LIBRARY={HOST_PYTHON_HOME}/lib/libpython{py_version_short}.dylib
      -DPython3_INCLUDE_DIR={HOST_PYTHON_HOME}/include/python{py_version_short}
# {% endif %}
