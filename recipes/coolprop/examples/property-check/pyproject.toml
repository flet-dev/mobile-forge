[project]
name = "coolprop-property-check"
version = "1.0.0"
description = "Fluid properties cross-checked against published reference values."
requires-python = ">=3.12"

dependencies = [
    "flet==0.86.5",
    "coolprop==7.2.0",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
