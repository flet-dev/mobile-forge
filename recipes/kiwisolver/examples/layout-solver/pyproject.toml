[project]
name = "kiwisolver-layout-solver"
version = "1.0.0"
description = "Solves a column layout with kiwisolver and draws the result."
requires-python = ">=3.10"

dependencies = [
    "flet==0.86.5",
    "kiwisolver==1.5.0",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
