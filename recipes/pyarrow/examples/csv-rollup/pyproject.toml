[project]
name = "pyarrow-csv-rollup"
version = "1.0.0"
description = "Reads a CSV back with Arrow and totals it per city."
requires-python = ">=3.10"

dependencies = [
    "flet==0.86.5",
    "pyarrow==24.0.0",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.android]
target_arch = ["arm64-v8a", "x86_64"]

[tool.flet.app]
path = "src"
