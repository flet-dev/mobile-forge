{% set version = "4.7.0" %}

package:
  name: flet-libtiff
  version: '{{ version }}'

source:
  url: https://download.osgeo.org/libtiff/tiff-{{ version }}.tar.gz

build:
  number: 10

requirements:
  host:
    - flet-libjpeg 3.0.90

patches:
  - config.patch

about:
  # tif_lzw.c carries a second Berkeley grant that LICENSE.md omits at 4.7.0;
  # upstream added that section afterwards, so 4.7.1+ ships the full text.
  license: libtiff AND BSD-4.3TAHOE
