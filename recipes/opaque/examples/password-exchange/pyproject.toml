[project]
name = "opaque-password-exchange"
version = "1.0.0"
description = "Runs both halves of an OPAQUE registration and login and compares the session keys."
requires-python = ">=3.10"

dependencies = [
    "flet==0.86.5",
    "opaque==1.0.0",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
