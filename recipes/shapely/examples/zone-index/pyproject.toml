[project]
name = "shapely-zone-index"
version = "1.0.0"
description = "Point-in-zone and nearest-zone queries answered twice, once through an STRtree."
requires-python = ">=3.11"

dependencies = [
    "flet==0.86.5",
    "shapely==2.1.2",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
