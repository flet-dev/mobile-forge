package:
  name: gdal
  # Pinned to match `flet-libgdal` (the host C library). GDAL's Python
  # bindings hard-require an exact major.minor match with libgdal —
  # any bump here must come with flet-libgdal bumped to the same
  # version, plus fiona / rasterio / pyogrio re-pinned in lockstep.
  version: "3.13.1"

requirements:
  host:
    - flet-libgdal 3.13.1
# {% if sdk == 'android' %}
    # libgdal links C++; the SWIG-generated _gdal.so loads via dlopen which
    # needs libc++_shared.so on Android.
    - flet-libcpp-shared >=27.2.12479018
# {% else %}
    # iOS-only — see GDAL_LIBS comment below for the rationale.
    - openssl >=3.0.15
    - flet-libjpeg 3.0.90
# {% endif %}

build:
  number: 1
  script_env:
    GDAL_VERSION: 3.13.1
    GDAL_PREFIX: '{platlib}/opt'
    GDAL_CFLAGS: ''
# {% if sdk != 'android' %}
    # iOS links every flet-lib* as a static archive, so the upper library is
    # missing the objects its own dependencies need; dyld aborts at dlopen on
    # the first unresolved symbol (_geod_init). Naming the whole chain here makes
    # each extension's link pull them in. Full explanation, and the upstream fix
    # that would retire it, in forge-error-catalogue: "symbol not found in flat
    # namespace" (iOS, transitive dep of a static flet-lib*).
    GDAL_LIBS: gdal,proj,tiff,curl,psl,sqlite3,jpeg,ssl,crypto,z
    LDFLAGS: '-undefined dynamic_lookup'
# {% endif %}

patches:
  - config.patch
