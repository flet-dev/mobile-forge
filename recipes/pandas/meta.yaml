package:
  name: pandas
  version: "3.0.3"

# {% if not version or version >= (2,1) %}
# pandas >= 2.1.0

requirements:
  build:
    - ninja
    - meson
  host:
    - numpy ^2.0.0
# {% if sdk == 'android' %}
    # pandas/_libs/window/aggregations is the one C++ translation unit in the
    # package (everything else in _libs is C), and Android has no system C++
    # runtime, so the NDK's libc++_shared has to be shipped. iOS links the OS's
    # /usr/lib/libc++.1.dylib and needs nothing.
    - flet-libcpp-shared 27.2.12479018
# {% endif %}

patches:
  - mobile.patch

build:
  number: 1
  script_env:
    # meson introspects numpy by running the cross-python from pandas's source
    # dir, whose top-level `pandas/io/` shadows the stdlib `io` on sys.path[0]
    # -> numpy's C-ext init fails ("cannot import name 'TextIOWrapper' from
    # 'io'"). PYTHONSAFEPATH drops that implicit cwd entry (leaving PYTHONPATH,
    # so crossenv's bridge still works).
    PYTHONSAFEPATH: "1"
  backend-args:
    # the meson-python cross-build handoff: forge's generated cross file is
    # what tells meson the target triple, compilers and sysroot.
    - -Csetup-args=--cross-file
    - -Csetup-args={MESON_CROSS_FILE}

# {% else %}
# pandas < 2.1.0

requirements:
  host:
    - numpy 1.26.4

# {% endif %}