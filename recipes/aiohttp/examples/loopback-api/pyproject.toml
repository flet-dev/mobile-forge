[project]
name = "aiohttp-loopback-api"
version = "1.0.0"
description = "Serves an HTTP and WebSocket API on loopback and calls it with aiohttp."
requires-python = ">=3.10"

dependencies = [
    "flet==0.86.5",
    "aiohttp==3.14.0",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
