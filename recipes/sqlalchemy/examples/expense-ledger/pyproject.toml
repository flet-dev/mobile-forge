[project]
name = "sqlalchemy-expense-ledger"
version = "1.0.0"
description = "An ORM expense ledger persisted to SQLite in app storage."
requires-python = ">=3.10"

dependencies = [
    "flet==0.86.5",
    "sqlalchemy==2.0.50",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
