[project]
name = "primp-impersonate-probe"
version = "1.0.0"
description = "Shows what primp puts on the wire for each browser it impersonates."
requires-python = ">=3.10"

dependencies = [
    "flet==0.86.5",
    "primp==1.3.1",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
