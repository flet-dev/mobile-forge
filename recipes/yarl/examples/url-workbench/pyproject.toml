[project]
name = "yarl-url-workbench"
version = "1.0.0"
description = "yarl and urllib.parse given the same URL, with the differences on screen."
requires-python = ">=3.10"

dependencies = [
    "flet==0.86.5",
    "yarl==1.24.2",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
