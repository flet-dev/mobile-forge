{% set version = "2.1.1" %}

package:
  name: flet-libcurl-impersonate
  version: '{{ version }}'
  # Prebuilt curl-impersonate static mega-archive (a single libcurl-impersonate.a
  # bundling patched curl + BoringSSL + nghttp2/nghttp3/ngtcp2 + brotli + zstd +
  # zlib) for consumers that statically link it — the curl-cffi recipe. This is a
  # link-time (host_build) dependency only; nothing is shipped to the device.
  #
  # Upstream publishes a per-(arch, platform) asset for exactly our slices, EXCEPT
  # armeabi-v7a — there is no 32-bit ARM Android build of curl-impersonate.
  excluded_arches:
    - armeabi-v7a

build:
  number: 1

source:
# {% if sdk == 'iphoneos' %}
  url: https://github.com/lexiforest/curl-impersonate/releases/download/v{{ version }}/libcurl-impersonate-v{{ version }}.arm64-apple-ios.tar.gz
# {% elif sdk == 'iphonesimulator' %}
  url: https://github.com/lexiforest/curl-impersonate/releases/download/v{{ version }}/libcurl-impersonate-v{{ version }}.{{ arch }}-apple-ios-simulator.tar.gz
# {% else %}
  # Android: arm64-v8a -> aarch64, x86_64 -> x86_64.
  url: https://github.com/lexiforest/curl-impersonate/releases/download/v{{ version }}/libcurl-impersonate-v{{ version }}.{% if arch == 'arm64-v8a' %}aarch64{% else %}{{ arch }}{% endif %}-linux-android.tar.gz
# {% endif %}
  # The release tarballs hold libcurl-impersonate.a + include/curl/ at the archive
  # root (no wrapper directory), so unpack verbatim rather than stripping a
  # nonexistent top-level component.
  strip: 0


about:
  # The release tarballs ship no licence text at all, so the notices are vendored in
  # licenses/ — every file there ships, so there is no list here to fall out of step
  # with the folder. libcurl-impersonate.a is a single `ld -r` blob merging nine
  # upstream projects, pinned by upstream's CMakeLists.txt at this tag and confirmed
  # in the archive by symbol probe:
  #
  #   curl 8.21.0                     curl          COPYING.curl
  #   curl-impersonate patches        MIT           LICENSE.curl-impersonate
  #   BoringSSL 156c7b75              Apache-2.0    LICENSE.boringssl
  #   nghttp2 1.63.0                  MIT           COPYING.nghttp2
  #   nghttp3 1.15.0                  MIT           COPYING.nghttp3
  #   ngtcp2 1.20.0                   MIT           COPYING.ngtcp2
  #   brotli 1.2.0                    MIT           LICENSE.brotli
  #   zstd 1.5.7                      BSD-3-Clause  LICENSE.zstd
  #   zlib 1.3.1                      Zlib          LICENSE.zlib
  #
  # On a bump, re-fetch each file from its project at the NEW pinned version and
  # re-run the probe — the component set is upstream's to change. Two traps: take
  # nghttp2's COPYING (its LICENSE is a 12-byte "See COPYING") and zstd's LICENSE
  # (its COPYING is the GPL-2.0 arm of a dual licence; we take the BSD arm).
  #
  # Same set on both platforms — one superbuild, only BoringSSL's asm differs.
  #
  # Deduplicated set of the nine, ANDed because the archive holds all of them at
  # once. zstd's GPL-2.0 alternative is deliberately not expressed: it is a fact
  # about the project, not about this artifact.
  license: curl AND MIT AND Apache-2.0 AND BSD-3-Clause AND Zlib
