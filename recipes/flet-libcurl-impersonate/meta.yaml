{% set version = "2.3.1" %}

package:
  name: flet-libcurl-impersonate
  version: '{{ version }}'
  # Prebuilt curl-impersonate static mega-archive (a single libcurl-impersonate.a
  # bundling patched curl + BoringSSL + c-ares + nghttp2/nghttp3/ngtcp2 + brotli +
  # zstd + zlib) for consumers that statically link it — the curl-cffi recipe. This is a
  # link-time (host_build) dependency only; nothing is shipped to the device.
  #
  # Upstream publishes a per-(arch, platform) asset for every slice we build.

build:
  number: 1

source:
# {% if sdk == 'iphoneos' %}
  url: https://github.com/lexiforest/curl-impersonate/releases/download/v{{ version }}/libcurl-impersonate-v{{ version }}.arm64-apple-ios.tar.gz
# {% elif sdk == 'iphonesimulator' %}
  url: https://github.com/lexiforest/curl-impersonate/releases/download/v{{ version }}/libcurl-impersonate-v{{ version }}.{{ arch }}-apple-ios-simulator.tar.gz
# {% else %}
  # Android: arm64-v8a -> aarch64, armeabi-v7a -> armv7, x86_64 -> x86_64.
  url: https://github.com/lexiforest/curl-impersonate/releases/download/v{{ version }}/libcurl-impersonate-v{{ version }}.{% if arch == 'arm64-v8a' %}aarch64{% elif arch == 'armeabi-v7a' %}armv7{% else %}{{ arch }}{% endif %}-linux-android.tar.gz
# {% endif %}
  # The release tarballs hold libcurl-impersonate.a + include/curl/ at the archive
  # root (no wrapper directory), so unpack verbatim rather than stripping a
  # nonexistent top-level component.
  strip: 0


about:
  # The 2.3.1 release tarballs carry their components' notices at the top level
  # (LICENSE, LICENSE_BORINGSSL, LICENSE_CARES, ...), identical across slices, and
  # forge's licence discovery ships them. libcurl-impersonate.a is one `ld -r` blob
  # merging curl, the curl-impersonate patches, BoringSSL, c-ares, nghttp2, nghttp3,
  # ngtcp2, brotli, zstd and zlib, so the expression ANDs all of them. zstd's notice
  # is its BSD arm; the GPL-2.0 alternative is not expressed.
  license: curl AND MIT AND Apache-2.0 AND BSD-3-Clause AND Zlib
