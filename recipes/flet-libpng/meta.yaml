{% set version = "1.6.43" %}

package:
  name: flet-libpng
  version: '{{ version }}'

build:
  number: 11

source:
  url: https://github.com/pnggroup/libpng/archive/refs/tags/v{{ version }}.tar.gz

patches:
  - config.patch

about:
  # Lowercase libpng-2.0: the capital-L `Libpng` licence applies only up to 1.6.35.
  license: libpng-2.0
