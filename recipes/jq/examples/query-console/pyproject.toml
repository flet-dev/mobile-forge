[project]
name = "jq-query-console"
version = "1.0.0"
description = "A jq query console over a bundled JSON document, on device."
requires-python = ">=3.10"

dependencies = [
    "flet==0.86.5",
    "jq==1.11.0",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
