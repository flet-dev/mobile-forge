package:
  name: cryptography
# cryptography 43.0.1 pins pyo3 0.22.2 which hard-stops at Python 3.13.
# 48.0.0 moves to pyo3 0.28 (knows 3.14) and classifies 3.14 as supported.
# 50.0.1 moves to pyo3 >= 0.29 — the first pyo3 line that knows 3.15
# (pyo3 0.28 hard-stops there, like 0.22.2 did at 3.14).
# {% if py_version.minor >= 15 %}
  version: "50.0.1"
# {% elif py_version.minor >= 14 %}
  version: "48.0.0"
# {% else %}
  version: 43.0.1
# {% endif %}

requirements:
  host:
    - openssl ^3.0.12

build:
  number: 10
  script_env:
    OPENSSL_DIR: '{platlib}/opt'
    _PYTHON_SYSCONFIGDATA_NAME: '{sysconfigdata_name}'