[project]
name = "secret-note"
version = "1.0.0"
description = "A note sealed under a passphrase with scrypt and Fernet."
requires-python = ">=3.10"

dependencies = [
    "flet==0.86.5",
    "cryptography",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"
