[project]
name = "scikit-learn-petals"
version = "1.0.0"
description = "An iris classifier fitted on device and cached in app storage."
requires-python = ">=3.11"

dependencies = [
    "flet==0.86.5",
    "scikit-learn==1.9.0",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"

[tool.flet.android]
extract_packages = ["sklearn"]
