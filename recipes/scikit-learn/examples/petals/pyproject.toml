[project]
name = "scikit-learn-petals"
version = "1.0.0"
description = "An iris classifier fitted on device and cached in app storage."
requires-python = ">=3.10"

dependencies = [
    "flet",
    "scikit-learn",
]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.app]
path = "src"

[tool.flet.android]
extract_packages = ["sklearn"]
